<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator Login | Jatra App BD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 40px; width: 100%; max-width: 400px; }
        .login-card h3 { font-weight: 800; color: #1e3c72; text-align: center; margin-bottom: 20px; }
        .btn-custom { background: #1e3c72; color: white; font-weight: bold; padding: 12px; border-radius: 8px; transition: 0.3s; }
        .btn-custom:hover { background: #2a5298; color: white; transform: translateY(-2px); }
        .alert { border-radius: 8px; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-card">
    <h3>🚌 Operator Portal</h3>
    <p class="text-center text-muted mb-4">Login to manage your transport services</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/operator_login" method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold text-dark">Operator Email</label>
            <input type="email" class="form-control" name="email" placeholder="e.g., hanif@jatra.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold text-dark">Password</label>
            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-custom w-100">LOGIN TO DASHBOARD</button>
    </form>

    <div class="text-center mt-4">
        <a href="/" class="text-decoration-none text-muted small">← Back to Main Website</a>
    </div>
</div>

</body>
</html>
